name: Create Docker Image (Release only + Manual version)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the image (e.g. 1.2.3, v1.2.3, 1.2.3-rc1)"
        required: true
      publish_latest:
        description: "Also publish :latest"
        required: true
        type: boolean
        default: false

  release:
    types: [published]

  push:
    branches:
      - release

env:
  REPO: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set lowercase repo name
        run: |
          echo "IMAGE_NAME=${REPO,,}" >> ${GITHUB_ENV}

      - name: Checkout the release branch
        uses: actions/checkout@v4.1.2
        with:
          ref: "release"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for the image
        uses: docker/metadata-action@v5.5.1
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # release 事件：推 release tag
            ${{ github.event_name == 'release' && github.ref_name || '' }}

            # push 到 release：推 latest
            ${{ github.event_name == 'push' && 'latest' || '' }}

            # 手动触发：推 version
            ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

            # 手动触发：可选再推 latest
            ${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest && 'latest' || '' }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
