# This workflow publishes Docker images for the release branch and supports manual builds.

name: Create Docker Image

on:
  release:
    types: [published]
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to publish, for example v1.0.0"
        required: true
        type: string
      publish_latest:
        description: "Also publish the latest tag"
        required: true
        default: false
        type: boolean
      source_ref:
        description: "Git ref to build from"
        required: false
        default: "release"
        type: string

env:
  REPO: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase repo name
        run: |
          echo "IMAGE_NAME=${REPO,,}" >> "${GITHUB_ENV}"

      - name: Checkout source
        uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'release' }}

      - name: Get the current branch name
        run: |
          echo "BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)" >> "${GITHUB_ENV}"

      - name: Determine Docker tags
        id: tags
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          TAGS=()

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAGS+=("${IMAGE}:${{ inputs.version_tag }}")
            if [[ "${{ inputs.publish_latest }}" == "true" ]]; then
              TAGS+=("${IMAGE}:latest")
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAGS+=("${IMAGE}:${GITHUB_REF_NAME}")
          else
            TAGS+=("${IMAGE}:${BRANCH_NAME}")
            if [[ "${BRANCH_NAME}" == "release" ]]; then
              TAGS+=("${IMAGE}:latest")
            fi
          fi

          {
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS[@]}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Extract metadata (labels) for the image
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
